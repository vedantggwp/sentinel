version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - codex-oss

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - codex-oss

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
    open-pull-requests-limit: 3
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - codex-oss
