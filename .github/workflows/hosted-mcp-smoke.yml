name: Hosted MCP Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-mcp-smoke:
    name: Verify hosted /mcp endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_URL: ${{ secrets.MCP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run hosted MCP smoke
        run: |
          if [ -z "${MCP_URL:-}" ]; then
            echo "MCP_URL repository secret is not configured."
            echo "Add the deployed /mcp endpoint as a repository secret, then rerun this manual workflow."
            exit 1
          fi
          python scripts/smoke_mcp_http.py
